<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B338A">
<title>Հայաստանի մրցույթներ</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Մրցույթներ">
<meta name="application-name" content="Մրցույթներ">
<link rel="preload" href="fonts/nsa-armenian.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nsa-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Noto Sans Armenian";src:url("fonts/nsa-armenian.woff2") format("woff2");font-weight:100 900;font-stretch:62.5% 100%;font-display:swap;unicode-range:U+0308,U+0530-058F,U+2010,U+2024,U+25CC,U+FB13-FB17}
@font-face{font-family:"Noto Sans Armenian";src:url("fonts/nsa-latin.woff2") format("woff2");font-weight:100 900;font-stretch:62.5% 100%;font-display:swap;unicode-range:U+0020-007E,U+00A0,U+00AB,U+00B0,U+00B7,U+00BB,U+00D7,U+2013-2014,U+2018-2019,U+201C-201D,U+2022,U+2026}

:root{
  /* Layout idea: dated notices on paper sheets. A date tile leads every line; press blue is the one spot ink. */
  --ground:#E8EAE4;       /* newsprint board */
  --sheet:#FCFCFA;        /* a sheet of notices */
  --sheet-2:#F0F1ED;      /* pressed row, quiet panel */
  --seg:#D8DBD3;
  --field:#FFFFFF;
  --ink:#14161A;
  --ink-2:#454A53;
  --ink-3:#5F656F;
  --rule:#E0E2DB;
  --rule-2:#C4C7BE;
  --shell:#1B338A;        /* press blue */
  --shell-2:#132669;
  --on-shell:#FFFFFF;
  --on-shell-2:#C9D3F7;
  --accent:#1F3A93;
  --on-accent:#FFFFFF;
  --tile:#DFE5F8;
  --tile-ink:#1B338A;
  --crit:#B4231A;         /* today or tomorrow */
  --crit-bg:#F8E0DC;
  --crit-tile:#C22B21;
  --on-crit-tile:#FFFFFF;
  --warn:#855600;         /* three days or less */
  --warn-bg:#F7EAC8;
  --warn-tile:#F1BC4B;
  --on-warn-tile:#2B1D00;
  --lift:0 1px 2px rgba(20,22,26,.05),0 12px 28px -18px rgba(20,22,26,.28);
  --focus:#1F3A93;
  --font:"Noto Sans Armenian","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --display:66%;          /* width axis for dates and the name */
  --ease:cubic-bezier(.16,1,.3,1);
  --tabs-h:4rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0E12;--sheet:#171A20;--sheet-2:#1F232B;--seg:#1D2129;--field:#0B0D11;--ink:#ECEBE5;--ink-2:#BABCB7;--ink-3:#9296A2;
    --rule:#262A33;--rule-2:#343944;--shell:#182B6E;--shell-2:#0F1C4E;--on-shell:#FFFFFF;--on-shell-2:#C3CEF3;--accent:#9DB4FF;
    --on-accent:#0C1433;--tile:#1F2B55;--tile-ink:#BCCAFF;--crit:#FF8B7B;--crit-bg:#3A1A17;--crit-tile:#FF8B7B;--on-crit-tile:#2A0A06;
    --warn:#EDB65C;--warn-bg:#33280F;--warn-tile:#EDB65C;--on-warn-tile:#2B1D00;--lift:none;--focus:#9DB4FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0C0E12;--sheet:#171A20;--sheet-2:#1F232B;--seg:#1D2129;--field:#0B0D11;--ink:#ECEBE5;--ink-2:#BABCB7;--ink-3:#9296A2;
  --rule:#262A33;--rule-2:#343944;--shell:#182B6E;--shell-2:#0F1C4E;--on-shell:#FFFFFF;--on-shell-2:#C3CEF3;--accent:#9DB4FF;
  --on-accent:#0C1433;--tile:#1F2B55;--tile-ink:#BCCAFF;--crit:#FF8B7B;--crit-bg:#3A1A17;--crit-tile:#FF8B7B;--on-crit-tile:#2A0A06;
  --warn:#EDB65C;--warn-bg:#33280F;--warn-tile:#EDB65C;--on-warn-tile:#2B1D00;--lift:none;--focus:#9DB4FF;color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%;height:100%;scrollbar-color:var(--rule-2) transparent;scrollbar-width:thin}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font:400 1rem/1.45 var(--font);font-stretch:100%;
  -webkit-font-smoothing:antialiased;accent-color:var(--accent);caret-color:var(--accent);overflow-wrap:break-word}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,ul,ol,dl,dd,dt{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;font-stretch:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
svg{display:block;flex:none}
.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic--s{width:1rem;height:1rem;stroke-width:2}
.wrap{max-width:40rem;margin-inline:auto;padding-inline:1rem}
.num{font-variant-numeric:tabular-nums lining-nums}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.shell{position:relative;overflow:hidden;padding-block:.875rem 1.125rem;border-radius:0 0 1.25rem 1.25rem;
  background:linear-gradient(180deg,var(--shell),var(--shell-2));color:var(--on-shell)}
.shell::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.1px,transparent 1.6px);background-size:10px 10px;
  -webkit-mask-image:linear-gradient(120deg,transparent 38%,#000 100%);mask-image:linear-gradient(120deg,transparent 38%,#000 100%)}
.shell .wrap{position:relative}
.shell-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.name{font-size:2.25rem;line-height:1.08;font-weight:800;font-stretch:var(--display)}
.size{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:.75rem;background:rgba(255,255,255,.13);
  font-weight:700;line-height:1;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.size .aa{display:flex;align-items:baseline;gap:1px}
.size .aa span:first-child{font-size:.8125rem}
.size .aa span:last-child{font-size:1.1875rem}
.size:active{background:rgba(255,255,255,.24);transform:scale(.94)}
.shell :focus-visible{outline-color:var(--on-shell)}
.date{margin-top:.125rem;color:var(--on-shell-2);font-size:.9375rem;line-height:1.4}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;min-height:2.125rem;margin-top:.625rem}
.stat{display:flex;align-items:baseline;gap:.375rem;padding:.25rem .625rem .3125rem;border-radius:.625rem;background:rgba(255,255,255,.13);
  font-size:.875rem;line-height:1.3;color:var(--on-shell-2);white-space:nowrap}
.stat b{font-size:1.1875rem;font-weight:800;font-stretch:var(--display);color:var(--on-shell)}
.stat--hot{background:var(--warn-tile);color:var(--on-warn-tile)}
.stat--hot b{color:inherit}
.search{margin-top:.75rem;display:flex;align-items:center;gap:.5rem;height:3rem;padding-inline:.875rem .25rem;border-radius:.875rem;
  background:var(--field);color:var(--ink);box-shadow:0 8px 20px -12px rgba(0,0,0,.45)}
.search:focus-within{outline:3px solid var(--on-shell);outline-offset:2px}
.search .ic{color:var(--ink-3)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;color:inherit;outline:0;padding:0;appearance:none;text-overflow:ellipsis}
.search input::placeholder{color:var(--ink-3);opacity:1}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:2.5rem;height:2.5rem;display:grid;place-items:center;color:var(--ink-3);border-radius:.625rem}

/* ---------- tabs: a segmented control ---------- */
.tabs{position:sticky;top:0;z-index:5;padding:.625rem 0 .375rem;background:var(--ground)}
.seg{position:relative;display:flex;padding:.25rem;border-radius:.875rem;background:var(--seg)}
.thumb{position:absolute;top:.25rem;bottom:.25rem;left:0;width:var(--w,calc((100% - .5rem)/3));border-radius:.625rem;background:var(--sheet);
  box-shadow:0 1px 3px rgba(20,22,26,.16);transform:translateX(var(--x,.25rem))}
.seg.live .thumb{transition:transform .28s var(--ease),width .28s var(--ease)}
.tab{position:relative;z-index:1;flex:1 1 auto;height:2.5rem;display:flex;align-items:center;justify-content:center;gap:.375rem;padding-inline:.375rem;
  white-space:nowrap;font-size:min(.9375rem,4vw);font-weight:600;font-stretch:88%;color:var(--ink-2);border-radius:.625rem;
  transition:color .18s var(--ease)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab .n{min-width:1.5em;padding:.05rem .4em;border-radius:1rem;background:rgba(127,133,140,.2);color:var(--ink-2);
  font-size:min(.8125rem,3.5vw);font-weight:650;font-stretch:100%;text-align:center;transition:background-color .18s var(--ease),color .18s var(--ease)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}

/* ---------- sector chips ---------- */
.chips{display:flex;gap:.5rem;overflow-x:auto;max-width:40rem;margin-inline:auto;padding:.375rem 1rem .25rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:2.5rem;padding-inline:.75rem .875rem;display:flex;align-items:center;gap:.375rem;white-space:nowrap;
  border-radius:1.25rem;background:var(--sheet);font-size:.9375rem;font-weight:500;color:var(--ink-2);
  transition:background-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.chip .ic{color:var(--ink-3)}
.chip .n{font-size:.8125rem;color:var(--ink-3)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed="true"] .ic,.chip[aria-pressed="true"] .n{color:inherit;opacity:.88}

.strip{margin-top:.75rem;padding:.5rem .75rem;border-radius:.75rem;border:1px dashed var(--rule-2);font-size:.8125rem;line-height:1.4;color:var(--ink-2)}
.strip--warn{border:0;background:var(--warn-bg);color:var(--ink)}

/* ---------- day groups and notice rows ---------- */
.day-h{position:sticky;top:var(--tabs-h);z-index:3;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:.875rem .25rem .5rem;background:var(--ground);font-size:1.0625rem;line-height:1.3;font-weight:750;font-stretch:80%}
.day-n{flex:none;font-size:.875rem;font-weight:500;font-stretch:100%;color:var(--ink-3)}
.day-n.is-warn{color:var(--warn);font-weight:650}
.day-n.is-crit{color:var(--crit);font-weight:700}
.rows{overflow:hidden;border-radius:1rem;background:var(--sheet);box-shadow:var(--lift)}
.day--bare{padding-top:.75rem}
.row{position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:4.875rem;right:0;height:1px;background:var(--rule)}
.row-main{display:grid;grid-template-columns:3.375rem minmax(0,1fr) 1rem;column-gap:.75rem;align-items:center;width:100%;padding:.75rem .625rem .75rem .75rem;text-align:left;
  transition:background-color .15s var(--ease)}
.row-main:active{background:var(--sheet-2)}
@media (hover:hover){.row-main:hover{background:var(--sheet-2)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.75rem;border-radius:.75rem;
  background:var(--tile);color:var(--tile-ink);font-stretch:var(--display);line-height:1;text-align:center}
.tile small{font-size:.75rem;font-weight:700;letter-spacing:.03em;opacity:.86}
.tile b{margin:.125rem 0 .0625rem;font-size:1.625rem;font-weight:800}
.tile--time b{margin:.1875rem 0 0;font-size:1.1875rem;font-stretch:72%}
.tile.is-warn{background:var(--warn-tile);color:var(--on-warn-tile)}
.tile.is-crit{background:var(--crit-tile);color:var(--on-crit-tile)}
.tile.is-off{background:var(--sheet-2);color:var(--ink-3)}
.tile--ic .ic{width:1.625rem;height:1.625rem}
.row-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  font-size:1.0625rem;line-height:1.28;font-weight:650;font-stretch:88%}
.row-buyer{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:.1875rem;
  font-size:.9375rem;line-height:1.35;color:var(--ink-2)}
.row-meta{display:block;overflow:hidden;margin-top:.3125rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.row-meta .mi{display:flex;flex-wrap:wrap;margin-left:-1rem}
.row-meta .mi>span{position:relative;display:inline-flex;align-items:center;gap:.3125rem;padding-left:1rem;white-space:nowrap}
.row-meta .mi>span::before{content:"";position:absolute;left:.375rem;top:.6em;width:.1875rem;height:.1875rem;border-radius:50%;background:var(--ink-3);opacity:.55}
.row-meta .mi>span.lead{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.row-hit{display:flex;align-items:center;gap:.3125rem;margin-top:.25rem;font-size:.9375rem;line-height:1.35;font-weight:600;color:var(--accent)}
.row-hit span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sumv{font-weight:650;color:var(--ink-2)}
.left.is-warn{color:var(--warn);font-weight:650}
.left.is-crit{color:var(--crit);font-weight:700}
.left.is-closed{font-weight:600}
.tag{color:var(--accent);font-weight:650}
.row.is-off .row-title{color:var(--ink-3)}
.go{width:1rem;height:1rem;color:var(--ink-3);opacity:.7;transform:scaleX(-1)}
.anim .day{animation:rise .36s var(--ease) both}
.anim .day:nth-child(2){animation-delay:.04s}
.anim .day:nth-child(n+3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(.625rem)}}

.empty{margin-top:1rem;padding:1.5rem 1.25rem 1.625rem;border-radius:1rem;background:var(--sheet);box-shadow:var(--lift);color:var(--ink-2)}
.empty h2{font-size:1.1875rem;line-height:1.3;font-weight:750;font-stretch:80%;color:var(--ink)}
.empty p{margin-top:.5rem;max-width:34ch}
.empty .btn{margin-top:1rem;display:inline-flex}
.skel{margin-top:1rem}
.skel i{display:block;border-radius:.375rem;background:linear-gradient(100deg,var(--sheet-2) 40%,var(--rule) 50%,var(--sheet-2) 60%) 0 0/300% 100%;animation:shimmer 1.3s linear infinite}
.skel .tile{background:none;padding:0}
.skel .tile i{width:100%;height:3.75rem;border-radius:.75rem}
@keyframes shimmer{to{background-position:-150% 0}}

.foot{margin-top:1.5rem;padding:0 .25rem 2.5rem;font-size:.875rem;line-height:1.45;color:var(--ink-3)}

/* ---------- notice view ---------- */
.dbar{position:sticky;top:0;z-index:5;background:var(--ground)}
.dbar-in{display:flex;align-items:center;justify-content:space-between;height:3.25rem;max-width:40rem;margin-inline:auto;padding-inline:.375rem .625rem}
.dbar button{height:2.75rem;display:flex;align-items:center;gap:.25rem;padding-inline:.5rem .75rem;border-radius:.75rem;font-weight:600;font-stretch:88%;
  transition:background-color .15s var(--ease)}
.dbar button:active{background:var(--seg)}
.dbar [data-share]{padding-inline:.75rem .5rem;flex-direction:row-reverse}
#detail .wrap{padding-bottom:2.5rem;animation:enter .3s var(--ease)}
html[data-nav] #detail .wrap{animation:none}
@keyframes enter{from{opacity:.3;transform:translateY(.625rem)}}
.hero{position:relative;overflow:hidden;padding:1.125rem 1rem 1.125rem;border-radius:1.25rem;
  background:linear-gradient(180deg,var(--shell),var(--shell-2));color:var(--on-shell)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.1px,transparent 1.6px);background-size:10px 10px;
  -webkit-mask-image:linear-gradient(120deg,transparent 45%,#000 100%);mask-image:linear-gradient(120deg,transparent 45%,#000 100%)}
.hero>*{position:relative}
.d-title{font-size:1.5rem;line-height:1.2;font-weight:750;font-stretch:80%;text-wrap:balance}
.d-title:focus{outline:0}
.d-buyer{margin-top:.5rem;color:var(--on-shell-2);line-height:1.4}
button.d-buyer{display:flex;align-items:center;gap:.25rem;max-width:100%;margin:.125rem 0 -.375rem -.5rem;padding:.375rem .375rem .375rem .5rem;border-radius:.625rem;text-align:left;transition:background-color .15s var(--ease)}
button.d-buyer span{text-decoration:underline;text-decoration-color:rgba(255,255,255,.4);text-decoration-thickness:1px;text-underline-offset:.24em}
button.d-buyer .go{color:inherit;opacity:.85}
button.d-buyer:active{background:rgba(255,255,255,.14)}
.hero-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.875rem}
.hero-tags{font-variant-numeric:tabular-nums lining-nums}
.hero-tags>span{display:inline-flex;align-items:center;gap:.3125rem;padding:.25rem .625rem;border-radius:1rem;background:rgba(255,255,255,.14);font-size:.875rem}
.sheet{margin-top:.75rem;padding:1rem;border-radius:1rem;background:var(--sheet);box-shadow:var(--lift)}
.due{display:grid;grid-template-columns:4.25rem minmax(0,1fr);gap:.875rem;align-items:center}
.due .tile{min-height:4.75rem;border-radius:.875rem;view-transition-name:tile}
.due .tile b{font-size:2.125rem}
.due .tile small{font-size:.8125rem}
.due-l{display:block;font-size:.875rem;color:var(--ink-3)}
.due-d{display:block;margin-top:.125rem;font-size:1.25rem;line-height:1.25;font-weight:750;font-stretch:80%}
.due-r{display:block;margin-top:.25rem;font-weight:650;color:var(--ink-2)}
.due.is-warn .due-r{color:var(--warn)}
.due.is-crit .due-r{color:var(--crit)}
.prog-w{grid-column:1/-1}
.prog{height:.375rem;border-radius:.25rem;background:var(--sheet-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:.25rem;background:var(--accent);transform-origin:left;animation:grow .7s var(--ease) .1s both}
.due.is-warn .prog i{background:var(--warn-tile)}
.due.is-crit .prog i{background:var(--crit-tile)}
@keyframes grow{from{transform:scaleX(0)}}
.prog-l{display:flex;justify-content:space-between;gap:1rem;margin-top:.375rem;font-size:.8125rem;color:var(--ink-3)}
.acts{display:grid;gap:.625rem;margin-top:.75rem}
@media (min-width:30rem){.acts{grid-template-columns:1fr 1fr}}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;padding:.5rem 1rem;border-radius:.875rem;
  background:var(--sheet);color:var(--ink);box-shadow:var(--lift);font-weight:650;font-stretch:88%;text-decoration:none;text-align:center;
  transition:transform .15s var(--ease),filter .15s var(--ease)}
.btn:active{transform:scale(.975)}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--primary:active{filter:brightness(.92)}
.sec h2{font-size:1.0625rem;line-height:1.3;font-weight:750;font-stretch:80%}
.facts{margin-top:.25rem}
.facts>div{display:grid;grid-template-columns:2.25rem minmax(0,1fr);column-gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.facts>div:last-child{border-bottom:0;padding-bottom:0}
.f-ic{grid-row:1/3;align-self:start;width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:.625rem;background:var(--tile);color:var(--tile-ink)}
.f-ic .ic{width:1.25rem;height:1.25rem}
.facts dt{font-size:.875rem;color:var(--ink-3)}
.facts dd{margin-top:.0625rem}
.facts small,.tl small{display:block;margin-top:.25rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.tl{margin-top:.875rem}
.tl li{position:relative;padding:0 0 1.125rem 1.875rem}
.tl li::before{content:"";position:absolute;left:.1875rem;top:.375rem;width:.75rem;height:.75rem;border-radius:50%;
  border:2px solid var(--ink-3);background:var(--sheet)}
.tl li::after{content:"";position:absolute;left:.5rem;top:1.375rem;bottom:-.125rem;width:2px;margin-left:-.5px;border-radius:1px;background:var(--rule)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl .is-past{color:var(--ink-3)}
.tl .is-past::before{background:var(--ink-3)}
.tl .is-past::after{background:var(--ink-3);opacity:.45}
.tl .is-key::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--tile)}
.tl .is-key.is-past::before{border-color:var(--ink-3);background:var(--ink-3);box-shadow:none}
.tl b{display:block;font-weight:650}
.tl .is-key b{font-weight:750}
.official{margin-top:.5rem;color:var(--ink-2)}
.code{margin-top:.5rem;font-size:.875rem;color:var(--ink-3)}
.steps{margin-top:.75rem;counter-reset:s}
.steps li{position:relative;padding:0 0 .75rem 2.125rem;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:.0625rem;width:1.5rem;height:1.5rem;border-radius:50%;
  display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);font-size:.8125rem;font-weight:800}
.fine{margin-top:.25rem;font-size:.875rem;color:var(--ink-3)}

/* ---------- inside a tender, how a tender ended, who takes part ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
.sec-n{flex:none;font-size:.875rem;color:var(--ink-3);white-space:nowrap}
.sec h3{margin-top:1.125rem;font-size:1rem;line-height:1.3;font-weight:750;font-stretch:80%}
.lede{margin-top:.375rem;font-size:.9375rem;line-height:1.45;color:var(--ink-2)}
.pct{color:var(--accent);font-weight:750;white-space:nowrap}
.bad{color:var(--crit);font-weight:700}
.more{display:block;width:100%;min-height:2.75rem;margin-top:.5rem;padding:.5rem .75rem;border-radius:.75rem;background:var(--sheet-2);
  font-weight:650;font-stretch:88%;text-align:center;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.more:active{transform:scale(.985);background:var(--seg)}
.sheet.none b{display:block;font-size:1.0625rem;line-height:1.3;font-weight:750;font-stretch:80%}
.sheet.none p{margin-top:.375rem;color:var(--ink-2)}
.acts--one{grid-template-columns:1fr}

/* the lots of an open tender */
.lots{margin-top:.5rem}
.lot{border-top:1px solid var(--rule)}
.lot:first-child{border-top:0}
.lot-b{display:grid;grid-template-columns:1.75rem minmax(0,1fr) auto;column-gap:.625rem;align-items:start;padding:.6875rem 0;list-style:none}
.lot-b::-webkit-details-marker{display:none}
details.lot>.lot-b{cursor:pointer}
.lot-n{height:1.5rem;min-width:1.5rem;padding-inline:.25rem;display:grid;place-items:center;border-radius:.4375rem;background:var(--tile);color:var(--tile-ink);
  font-size:.8125rem;font-weight:800;line-height:1}
.lot-t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.lot-q{padding-top:.0625rem;font-size:.9375rem;font-weight:650;color:var(--ink-2);white-space:nowrap}
.lot-more{display:block;margin-top:.125rem;font-size:.875rem;font-weight:500;color:var(--accent)}
.lot-was{display:block;margin-top:.1875rem;font-size:.875rem;line-height:1.35;font-weight:400;color:var(--ink-2)}
details.lot[open] .lot-more{display:none}
.lot-s{margin:-.125rem 0 .75rem 2.375rem;font-size:.9375rem;line-height:1.5;color:var(--ink-2);overflow-wrap:anywhere}
@supports (interpolate-size:allow-keywords){
  .lot{interpolate-size:allow-keywords}
  details.lot::details-content{block-size:0;overflow:clip;transition:block-size .3s var(--ease),content-visibility .3s allow-discrete}
  details.lot[open]::details-content{block-size:auto}
}
.lot-find{display:flex;align-items:center;gap:.5rem;height:2.75rem;margin-top:.625rem;padding-inline:.75rem;border-radius:.75rem;background:var(--sheet-2);color:var(--ink-3)}
.lot-find:focus-within{outline:3px solid var(--focus);outline-offset:1px}
.lot-find input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;color:var(--ink);outline:0;padding:0;appearance:none}
.lot-find input::placeholder{color:var(--ink-3);opacity:1}
.lot-find input::-webkit-search-cancel-button{display:none}
.ship{margin-top:.5rem;padding-top:.75rem;border-top:1px solid var(--rule);font-size:.9375rem;line-height:1.45;color:var(--ink-2)}
.ship b{display:block;font-size:.875rem;font-weight:400;color:var(--ink-3)}
.ship p+p{margin-top:.625rem}
.ship+.fine,.more+.fine,.lots+.fine{margin-top:.75rem}

/* an earlier purchase: the estimate, and where the auction took the price */
/* rows that lead somewhere answer a press across the whole sheet; the hairline between them stays inset */
.cmp,.who{position:relative;width:calc(100% + 2rem);margin-inline:-1rem;padding-inline:1rem;text-align:left;transition:background-color .15s var(--ease)}
.cmp::before,.who::before{content:"";position:absolute;top:0;left:1rem;right:1rem;height:1px;background:var(--rule)}
.sec-h+.cmp::before,.lede+.cmp::before,.sec-h+.who::before,.usual+.who::before{display:none}
button.cmp:active,button.who:active{background:var(--sheet-2)}
@media (hover:hover){button.cmp:hover,button.who:hover{background:var(--sheet-2)}}
.cmp{display:block;padding-block:.8125rem}
.sec-h+.cmp{padding-top:.5rem}
.cmp-h{display:flex;align-items:flex-start;gap:.5rem}
.cmp-h .lot-n{flex:none;margin-top:-.0625rem}
.cmp-t{display:block;min-width:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cmp-t .and{font-weight:400;color:var(--ink-3)}
.cmp-m{display:block;margin-top:.125rem;font-size:.875rem;line-height:1.4;font-weight:400;color:var(--ink-3)}
.cmp-r{display:block;margin-top:.25rem;font-size:.9375rem;line-height:1.4;color:var(--ink-2)}
.bar{position:relative;display:block;height:.5rem;margin-top:.5625rem;border-radius:.25rem;background:var(--tile);overflow:hidden}
.bar i{position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--v,1))}
.cmp-n{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin-top:.4375rem;font-size:.9375rem;line-height:1.35;color:var(--ink-2)}
.cmp-n b{font-weight:750;color:var(--ink)}
.cmp-n .pct{color:var(--accent)}
.usual{margin-top:.75rem;padding:.6875rem .8125rem;border-radius:.75rem;background:var(--tile);color:var(--tile-ink);font-weight:600;line-height:1.4}
.usual b{font-weight:800}
.usual small{display:block;margin-top:.125rem;font-size:.875rem;font-weight:400;opacity:.85}
.stat3+.usual{margin-top:.625rem}

.who{display:grid;grid-template-columns:minmax(0,1fr) 1rem;column-gap:.625rem;align-items:center;padding-block:.6875rem}
.sec-h+.who{padding-top:.625rem}
.who b{display:block;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.who small{display:block;margin-top:.125rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.who small b{display:inline;font-weight:650}
div.who{grid-template-columns:minmax(0,1fr)}
.who+.fine,.cmp+.fine{margin-top:.5rem}
.linkish{display:inline;text-align:left;font-weight:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--rule-2);text-decoration-thickness:1px;text-underline-offset:.22em}

/* what a bid has to carry */
.need{margin-top:.75rem}
.need li{position:relative;padding:0 0 .75rem 2.125rem;line-height:1.35}
.need li>.ic{position:absolute;left:0;top:.0625rem;width:1.5rem;height:1.5rem;padding:.3125rem;border-radius:.4375rem;background:var(--tile);color:var(--tile-ink);stroke-width:3}
.need b{font-weight:650}
.need small{display:block;margin-top:.125rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.win{margin-top:.25rem}
.win li{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.5625rem 0;border-bottom:1px solid var(--rule)}
.win li:last-child{border-bottom:0}
.win b{display:block;font-weight:600;line-height:1.3}
.win small{display:block;font-size:.875rem;color:var(--ink-3)}
.win span{flex:none;font-size:1.375rem;line-height:1.2;font-weight:800;font-stretch:var(--display);color:var(--accent)}
.ask{display:grid;gap:.5rem;margin-top:.625rem}
.ask .btn{justify-content:flex-start;min-height:3rem;padding-inline:.875rem;background:var(--sheet-2);box-shadow:none;font-weight:600;min-width:0}
.ask .btn span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ask .ic{color:var(--accent)}

/* how a tender ended */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1rem}
.sum div span{display:block;font-size:.875rem;line-height:1.35;color:var(--ink-3)}
.sum div b{display:block;margin-top:.125rem;font-size:1.375rem;line-height:1.2;font-weight:800;font-stretch:var(--display);white-space:nowrap}
.sum div+div b{color:var(--accent)}
.sum .bar{grid-column:1/-1;margin-top:0;height:.625rem;border-radius:.3125rem}
.sum-l,.sum-f{grid-column:1/-1}
.sum-l{margin-top:-.125rem;font-size:1.0625rem;line-height:1.35;font-weight:600}
.sum-f{font-size:.9375rem;line-height:1.45;color:var(--ink-2)}
.sum-l+.sum-f{margin-top:-.5rem}
.lotr{padding:.9375rem 0 .875rem;border-top:1px solid var(--rule)}
.lotrs>.lotr:first-child{border-top:0;padding-top:.625rem}
.lotrs>.lede{padding:.5rem 0 .75rem}
.sum-w{grid-column:1/-1;margin-top:-.25rem;padding-top:.6875rem;border-top:1px solid var(--rule);font-size:.875rem;line-height:1.45;color:var(--ink-3)}
.lotr-h{display:grid;grid-template-columns:1.75rem minmax(0,1fr);column-gap:.625rem;align-items:start}
.lotr-h .lot-t{display:block}
.lotr .bar{margin:.625rem 0 .25rem}
.bid{display:grid;grid-template-columns:1.75rem minmax(0,1fr) auto;column-gap:.625rem;align-items:start;padding-top:.5625rem;line-height:1.35}
.bid-p{justify-self:center;font-weight:800;color:var(--ink-3)}
.bid-n{min-width:0;overflow-wrap:anywhere}
.bid-n small{display:block;margin-top:.0625rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.bid-v{white-space:nowrap;font-weight:600}
.bid.is-1 .bid-p{width:1.5rem;height:1.5rem;margin-top:-.0625rem;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.875rem}
.bid.is-1 .bid-n>:first-child,.bid.is-1 .bid-v{font-weight:750}
.bid.is-rej,.bid.is-rej .bid-p{color:var(--ink-3)}
.bid.is-rej .bid-v{font-weight:400;text-decoration:line-through}
.bid-none{margin:.5rem 0 0 2.375rem;color:var(--ink-3)}
.lotrs+.more{margin-top:.25rem}
.lotrs+.fine,.lotrs+.more+.fine{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--rule)}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.stat3 div{padding:.6875rem .375rem .625rem;border-radius:.75rem;background:var(--sheet-2);text-align:center}
.stat3 b{display:block;font-size:1.5rem;line-height:1.15;font-weight:800;font-stretch:var(--display)}
.stat3 span{display:block;margin-top:.1875rem;font-size:.8125rem;line-height:1.25;color:var(--ink-2)}
.stat3+.fine{margin-top:.625rem}

.sec--rows{padding-bottom:.375rem}
.rows--in{overflow:visible;margin:.375rem -1rem 0;border-radius:0;background:none;box-shadow:none}
.rows--in .row-main{padding-inline:1rem .875rem}
.rows--in .row+.row::before{left:5.125rem}
.rows--in+.more{margin-bottom:.625rem}
.sec--rows>.lede{padding-bottom:.625rem}

.wait i{display:block;height:1rem;margin-top:.75rem;border-radius:.375rem;background:linear-gradient(100deg,var(--sheet-2) 40%,var(--rule) 50%,var(--sheet-2) 60%) 0 0/300% 100%;animation:shimmer 1.3s linear infinite}
.wait i:first-child{width:46%;height:1.125rem;margin-top:0}
.wait i:nth-child(3n){width:72%}
.wait i:last-child{width:58%}

/* what has just arrived settles into place: sheets rise, bars fall from the estimate to the price */
.fresh>.sheet{animation:rise .4s var(--ease) both}
.fresh>.sheet+.sheet{animation-delay:.06s}
.fresh .bar i{animation:drop .95s var(--ease) .12s both}
.fresh .cmp~.cmp .bar i,.fresh .lotr~.lotr .bar i{animation-delay:.2s}
.fresh .cmp~.cmp~.cmp .bar i,.fresh .lotr~.lotr~.lotr .bar i{animation-delay:.28s}
@keyframes drop{from{transform:scaleX(1)}}

.toast{position:fixed;left:50%;bottom:1.25rem;z-index:20;max-width:calc(100% - 2rem);padding:.6875rem 1rem;border-radius:.875rem;
  background:var(--ink);color:var(--ground);font-size:.9375rem;font-weight:500;box-shadow:0 10px 28px -8px rgba(0,0,0,.4);
  transform:translate(-50%,1rem);opacity:0;pointer-events:none;transition:transform .26s var(--ease),opacity .2s var(--ease)}
.toast.on{transform:translate(-50%,0);opacity:1}

body[data-view="detail"] #home{display:none}
body[data-view="list"] #detail{display:none}

/* ---------- wide screens: the list on the left, the chosen notice beside it ---------- */
@media (min-width:64rem){
  body{display:grid;grid-template-columns:minmax(24rem,30rem) minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;
    height:100vh;height:100dvh;min-height:0;overflow:hidden;column-gap:.5rem;max-width:92rem;margin-inline:auto}
  body[data-view] #home{display:contents}
  body[data-view] #detail{display:block}
  .shell{grid-column:1/-1}
  .shell .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(20rem,30rem) auto;column-gap:1rem;align-items:center;
    max-width:none;padding-inline:1.5rem}
  .shell-top{display:contents}
  .name{grid-area:1/1}
  .search{grid-area:1/2;margin-top:0}
  .size{grid-area:1/3}
  .date{grid-area:2/1}
  .stats{grid-area:2/2/3/4;justify-content:flex-end;margin-top:.625rem}
  .tabs{grid-area:2/1;position:static}
  .chips{grid-area:3/1;width:100%;max-width:none;margin:0;padding-bottom:.5rem}
  #list{grid-area:4/1;width:100%;max-width:none;margin:0;padding-bottom:1rem;overflow-y:auto;scrollbar-width:thin}
  #home>footer{grid-area:5/1;width:100%;max-width:none;margin:0}
  .foot{margin-top:.5rem;padding-bottom:.75rem}
  .day-h{top:0}
  .day:first-child .day-h{padding-top:.25rem}
  #pane{grid-area:2/2/6/3;display:flex;flex-direction:column;min-height:0}
  #pane .chips{flex:none;flex-wrap:wrap;gap:.375rem;overflow:visible;max-width:none;margin:0;padding:.625rem 1.5rem .25rem .5rem}
  #pane .chip{height:2.125rem;padding-inline:.625rem .75rem;font-size:.875rem}
  #detail{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
  #detail .wrap,.dbar-in{max-width:44rem}
  .dbar-in{justify-content:flex-end}
  body[data-deep] .dbar-in{justify-content:space-between}
  body:not([data-deep]) .dbar [data-back]{display:none}
  .row[aria-current="true"] .row-main{background:var(--sheet-2);background:color-mix(in srgb,var(--accent) 10%,var(--sheet))}
  .row[aria-current="true"] .tile:not(.is-crit):not(.is-warn):not(.is-off){background:var(--accent);color:var(--on-accent)}
  .row[aria-current="true"] .go{color:var(--accent);opacity:1}
  #detail:empty::after{content:"Ընտրեք մրցույթը ցանկից";display:grid;place-items:center;height:60%;color:var(--ink-3)}
}

/* moving between the list and a notice */
html[data-nav="push"]::view-transition-old(root){animation:vt-out .18s var(--ease) both}
html[data-nav="push"]::view-transition-new(root){animation:vt-in-side .32s var(--ease) both}
html[data-nav="pop"]::view-transition-old(root){animation:vt-out-side .2s var(--ease) both}
html[data-nav="pop"]::view-transition-new(root){animation:vt-in .26s var(--ease) both}
::view-transition-group(tile){animation-duration:.34s;animation-timing-function:var(--ease)}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0}}
@keyframes vt-in-side{from{opacity:0;transform:translateX(1.5rem)}}
@keyframes vt-out-side{to{opacity:0;transform:translateX(1.5rem)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const HOUR = 36e5, DAY = 864e5, TZ = 4 * HOUR;            // Yerevan is UTC+4 all year
const toDate = s => (s ? new Date(s.slice(0, 16) + ':00+04:00') : null);
const dOnly = s => (/^\d{4}-\d\d-\d\d/.test(s || '') ? new Date(s.slice(0, 10) + 'T12:00:00+04:00') : null);
const dayNo = d => Math.floor((d.getTime() + TZ) / DAY);   // calendar day in Yerevan
const parts = d => { const x = new Date(d.getTime() + TZ); return {y: x.getUTCFullYear(), m: x.getUTCMonth(), d: x.getUTCDate(), wd: x.getUTCDay(), hh: x.getUTCHours(), mm: x.getUTCMinutes()}; };
const p2 = n => String(n).padStart(2, '0');

const WD = ['կիրակի', 'երկուշաբթի', 'երեքշաբթի', 'չորեքշաբթի', 'հինգշաբթի', 'ուրբաթ', 'շաբաթ'];
const WD3 = ['ԿԻՐ', 'ԵՐԿ', 'ԵՐՔ', 'ՉՐՔ', 'ՀՆԳ', 'ՈՒՐԲ', 'ՇԲԹ'];
const MON = ['հունվարի', 'փետրվարի', 'մարտի', 'ապրիլի', 'մայիսի', 'հունիսի', 'հուլիսի', 'օգոստոսի', 'սեպտեմբերի', 'հոկտեմբերի', 'նոյեմբերի', 'դեկտեմբերի'];
const MON3 = ['ՀՆՎ', 'ՓՏՐ', 'ՄՐՏ', 'ԱՊՐ', 'ՄՅՍ', 'ՀՆՍ', 'ՀԼՍ', 'ՕԳՍ', 'ՍԵՊ', 'ՀՈԿ', 'ՆՈՅ', 'ԴԵԿ'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fTime = d => { const p = parts(d); return `${p2(p.hh)}:${p2(p.mm)}`; };
const fDay = d => { const p = parts(d); return `${p.d} ${MON[p.m]}`; };
const fDayY = d => fDay(d) + (parts(d).y !== parts(new Date(now())).y ? ` ${parts(d).y}` : '');   // the year only when it is not this one
const fDayW = d => `${cap(WD[parts(d).wd])}, ${fDay(d)}`;
const since = d => { const p = parts(d); return `${p.y !== parts(new Date(now())).y ? `${p.y} թ. ` : ''}${MON[p.m]} ${p.d}-ից`; };   // նոյեմբերի 10-ից
const fFull = d => `${fDay(d)}, ${WD[parts(d).wd]}, ժ. ${fTime(d)}`;
const fStamp = d => `${fDay(d)}, ${fTime(d)}`;
const fShort = d => { const p = parts(d); return `${p2(p.d)}.${p2(p.m + 1)}`; };

/* numbers the way they are written in Armenian: 11 520 000 · 11,5 մլն · 12% */
const NB = ' ';
const group = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
function short(n) {
  const a = Math.abs(n), f = (v, unit) => String(+v.toFixed(Math.abs(v) < 10 ? 2 : Math.abs(v) < 100 ? 1 : 0)).replace('.', ',') + NB + unit;
  return a >= 999.5e6 ? f(n / 1e9, 'մլրդ') : a >= 999.5e3 ? f(n / 1e6, 'մլն') : a >= 1e4 ? f(n / 1e3, 'հազ.') : group(n);
}
const money = n => (n == null ? '—' : short(n) + NB + 'դրամ');
const qty = n => { const [whole, part] = String(+(+n).toFixed(3)).split('.'); return group(+whole) + (part ? ',' + part : ''); };
const off = (low, est) => (low && est ? Math.round((1 - low / est) * 100) : null);   // how far below the estimate, in percent
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const plural = (n, word) => `${group(n)}${NB}${word}`;
const ord = n => `${n}-${n === 1 ? 'ին' : 'րդ'}`;         // 1-ին, 2-րդ, 3-րդ

const SECTORS = {med: 'Բժշկական', food: 'Սնունդ', fuel: 'Վառելիք', build: 'Շինարարություն', it: 'ՏՏ և կապ', auto: 'Տրանսպորտ',
  elec: 'Էլեկտրական', furn: 'Կահույք', home: 'Տնտեսական', cloth: 'Հագուստ', office: 'Գրասենյակ',
  equip: 'Սարքեր', serv: 'Ծառայություններ', other: 'Այլ'};
const KINDS = {
  goods: ['Ապրանք', 'Պետք է մատակարարել ապրանք։'],
  services: ['Ծառայություն', 'Պետք է մատուցել ծառայություն։'],
  works: ['Աշխատանք', 'Պետք է կատարել աշխատանք, օրինակ՝ շինարարություն կամ վերանորոգում։']
};
const NO_SUBJECT = 'Գնման առարկան վերնագրում նշված չէ';
const ARMEPS = 'https://eauction.armeps.am';
const pageOf = id => `${ARMEPS}/hy/public/tender_details/by_end_bid_time/2/tid/${id}/`;
const safe = u => (/^https:\/\//.test(u || '') ? u : '#');
const ic = (name, cls = '') => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const WIDE = matchMedia('(min-width:64rem)');               // room for the list and a notice side by side

/* ---------- state ---------- */
const S = {all: [], byId: new Map(), meta: {}, rev: 0, tab: 'new', sector: 'all', q: '', frozen: null, scroll: 0,
  stack: [], pos: [], more: new Set(), loaded: false, dirty: false, queue: [], stamp: '', idx: null, counted: false};
const now = () => S.frozen ?? Date.now();
const store = {
  get(k) { try { return localStorage.getItem('tb.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('tb.' + k, v); } catch { /* private mode or full: keep it in memory */ } }
};
const IN_TG = /tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy;   // known before the Telegram script loads
let tg = null;

/* ---------- extra data, fetched when a screen asks for it ---------- */
const DATA = new Map(), WAIT = new Map(), AT = new Map();
const peek = path => DATA.get(path);     // undefined: not here yet · null: there is no such file
function get(path, again) {
  if (DATA.has(path) && !again) return Promise.resolve(DATA.get(path));
  let p = WAIT.get(path);
  if (!p) {
    p = fetch('data/' + path, {cache: 'no-cache'})
      .then(r => (r.ok ? r.json() : r.status === 404 ? null : Promise.reject(new Error(r.status))))
      .then(v => { DATA.set(path, v); AT.set(path, Date.now()); return v; },
        () => {                                              // no connection: say "nothing" now, ask again later
          if (!DATA.has(path)) { DATA.set(path, null); AT.set(path, 0); setTimeout(() => { if (AT.get(path) === 0) DATA.delete(path); }, 15e3); }
          return DATA.get(path);
        })
      .finally(() => WAIT.delete(path));
    WAIT.set(path, p);
  }
  return p;
}
const stale = path => DATA.get(path) != null && Date.now() - AT.get(path) > 30 * 60e3;

/* ---------- time left ---------- */
function left(end) {
  const ms = end - now(), days = dayNo(end) - dayNo(new Date(now()));
  if (ms <= 0) return {text: 'ժամկետն անցել է', lvl: 'closed'};
  if (days === 0) return {text: `այսօր, մինչև ${fTime(end)}`, lvl: 'crit'};
  if (days === 1) return {text: `վաղը, մինչև ${fTime(end)}`, lvl: 'crit'};
  return {text: `մնաց ${days} օր`, lvl: days <= 3 ? 'warn' : 'ok'};
}
const isOpen = t => t.status === 'open' && t.endD && t.endD > now();
const norm = s => String(s || '').toLowerCase().replace(/և/g, 'եվ').replace(/[«»"“”().,՝։;]/g, ' ').replace(/\s+/g, ' ').trim();
const hay = t => t.hay || (t.hay = norm(t.res ? [t.subject, t.buyer, t.lead, SECTORS[t.sector]].join(' ')
  : [t.subject, t.title, t.buyer, t.for, t.code, SECTORS[t.sector], t.ln].join(' ')));
const words = () => norm(S.q).split(' ').filter(Boolean);

/* ---------- lists ---------- */
let memo = {rev: -1, min: -1, open: []};
function openNow() {                      // the open tenders, worked out once a minute at most
  const min = Math.floor(now() / 6e4);
  if (memo.rev !== S.rev || memo.min !== min) memo = {rev: S.rev, min, open: S.all.filter(isOpen)};
  return memo.open;
}
function results() {                      // finished tenders, newest first; undefined while they are on their way
  const d = peek('h/recent.json');
  if (!d) return d;
  return d.list || (d.list = (d.rows || []).map(r => ({res: 1, id: r[0], key: 'r' + r[0], subject: r[1], buyer: r[2], bk: r[3],

/* a number that runs to its value: the header counts on the first visit, the price after an auction */
function roll(el, from, to, fmt, ms) {
  if (CALM || from === to || document.hidden) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => {
    const x = Math.min(1, (t - t0) / ms);
    el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - x, 4)));

/* Long lists are drawn a screenful at a time: the first rows at once, the rest as the reader scrolls. */
function flush(cap) {
  const more = $('#more');
  if (!more) return;
  let n = 0;
  while (S.queue.length && n < cap) {
    const g = S.queue[0];
    let sec = $(`.day[data-k="${g.key}"]`);
    if (!sec) {
      more.insertAdjacentHTML('beforebegin', `<section class="day${g.head ? '' : ' day--bare'}" data-k="${g.key}">${g.head}<ul class="rows"></ul></section>`);
      sec = more.previousElementSibling;
    }
    const take = g.rows.splice(0, cap - n);
    sec.lastElementChild.insertAdjacentHTML('beforeend', take.map(t => (t.res ? resRowHTML(t) : rowHTML(t, S.tab))).join(''));
    n += take.length;
    if (!g.rows.length) S.queue.shift();
  }
  if (!S.queue.length) more.remove();
}

    $('#list').innerHTML = `<div class="empty"><h2>Մրցույթները չհաջողվեց բեռնել</h2><p>Ստուգեք ինտերնետ կապը և փորձեք նորից։</p><button class="btn btn--primary" type="button" data-retry>Փորձել նորից</button></div>`;
  }
}

/* ---------- Telegram ---------- */
function initTelegram() {
  if (!IN_TG) return;
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  const start = () => {
    const app = window.Telegram && window.Telegram.WebApp;
    if (!app || app.initData === undefined || tg) return;
    tg = app;
    const theme = () => {
      document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
      const css = getComputedStyle(document.documentElement), ground = css.getPropertyValue('--ground').trim();
      try { tg.setHeaderColor(css.getPropertyValue('--shell').trim()); tg.setBackgroundColor(ground); tg.setBottomBarColor && tg.setBottomBarColor(ground); } catch { /* old clients */ }
    };
    try { tg.ready(); tg.expand(); theme(); tg.onEvent('themeChanged', theme); tg.BackButton.onClick(() => back()); } catch { /* old clients */ }
    try { if (S.stack.length && !WIDE.matches) tg.BackButton.show(); } catch { /* old clients */ }
  };
  s.onload = start;
  document.head.appendChild(s);
}

/* ---------- start ---------- */
applySize(+store.get('size') || 0);
initTelegram();
try { const kept = store.get('data'); if (kept) { ingest(JSON.parse(kept)); render(true); route(); } } catch { /* a damaged copy: wait for the network */ }
load();
})();
</script>
