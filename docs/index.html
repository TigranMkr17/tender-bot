<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B338A">
<title>Հայաստանի մրցույթներ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B338A'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/nsa-armenian.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nsa-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Noto Sans Armenian";src:url("fonts/nsa-armenian.woff2") format("woff2");font-weight:100 900;font-stretch:62.5% 100%;font-display:swap;unicode-range:U+0308,U+0530-058F,U+2010,U+2024,U+25CC,U+FB13-FB17}
@font-face{font-family:"Noto Sans Armenian";src:url("fonts/nsa-latin.woff2") format("woff2");font-weight:100 900;font-stretch:62.5% 100%;font-display:swap;unicode-range:U+0020-007E,U+00A0,U+00AB,U+00B0,U+00B7,U+00BB,U+00D7,U+2013-2014,U+2018-2019,U+201C-201D,U+2022,U+2026}

:root{
  /* Layout idea: dated notices on paper sheets. A date tile leads every line; press blue is the one spot ink. */
  --ground:#E8EAE4;       /* newsprint board */
  --sheet:#FCFCFA;        /* a sheet of notices */
  --sheet-2:#F0F1ED;      /* pressed row, quiet panel */
  --seg:#D8DBD3;
  --field:#FFFFFF;
  --ink:#14161A;
  --ink-2:#454A53;
  --ink-3:#5F656F;
  --rule:#E0E2DB;
  --rule-2:#C4C7BE;
  --shell:#1B338A;        /* press blue */
  --shell-2:#132669;
  --on-shell:#FFFFFF;
  --on-shell-2:#C9D3F7;
  --accent:#1F3A93;
  --on-accent:#FFFFFF;
  --tile:#DFE5F8;
  --tile-ink:#1B338A;
  --crit:#B4231A;         /* today or tomorrow */
  --crit-bg:#F8E0DC;
  --crit-tile:#C22B21;
  --on-crit-tile:#FFFFFF;
  --warn:#855600;         /* three days or less */
  --warn-bg:#F7EAC8;
  --warn-tile:#F1BC4B;
  --on-warn-tile:#2B1D00;
  --lift:0 1px 2px rgba(20,22,26,.05),0 12px 28px -18px rgba(20,22,26,.28);
  --focus:#1F3A93;
  --font:"Noto Sans Armenian","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --display:66%;          /* width axis for dates and the name */
  --ease:cubic-bezier(.16,1,.3,1);
  --tabs-h:4rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0E12;--sheet:#171A20;--sheet-2:#1F232B;--seg:#1D2129;--field:#0B0D11;--ink:#ECEBE5;--ink-2:#BABCB7;--ink-3:#9296A2;
    --rule:#262A33;--rule-2:#343944;--shell:#182B6E;--shell-2:#0F1C4E;--on-shell:#FFFFFF;--on-shell-2:#C3CEF3;--accent:#9DB4FF;
    --on-accent:#0C1433;--tile:#1F2B55;--tile-ink:#BCCAFF;--crit:#FF8B7B;--crit-bg:#3A1A17;--crit-tile:#FF8B7B;--on-crit-tile:#2A0A06;
    --warn:#EDB65C;--warn-bg:#33280F;--warn-tile:#EDB65C;--on-warn-tile:#2B1D00;--lift:none;--focus:#9DB4FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0C0E12;--sheet:#171A20;--sheet-2:#1F232B;--seg:#1D2129;--field:#0B0D11;--ink:#ECEBE5;--ink-2:#BABCB7;--ink-3:#9296A2;
  --rule:#262A33;--rule-2:#343944;--shell:#182B6E;--shell-2:#0F1C4E;--on-shell:#FFFFFF;--on-shell-2:#C3CEF3;--accent:#9DB4FF;
  --on-accent:#0C1433;--tile:#1F2B55;--tile-ink:#BCCAFF;--crit:#FF8B7B;--crit-bg:#3A1A17;--crit-tile:#FF8B7B;--on-crit-tile:#2A0A06;
  --warn:#EDB65C;--warn-bg:#33280F;--warn-tile:#EDB65C;--on-warn-tile:#2B1D00;--lift:none;--focus:#9DB4FF;color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%;height:100%;scrollbar-color:var(--rule-2) transparent;scrollbar-width:thin}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font:400 1rem/1.45 var(--font);font-stretch:100%;
  -webkit-font-smoothing:antialiased;accent-color:var(--accent);caret-color:var(--accent);overflow-wrap:break-word}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,ul,ol,dl,dd,dt{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;font-stretch:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
svg{display:block;flex:none}
.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic--s{width:1rem;height:1rem;stroke-width:2}
.wrap{max-width:40rem;margin-inline:auto;padding-inline:1rem}
.num{font-variant-numeric:tabular-nums lining-nums}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.shell{position:relative;overflow:hidden;padding-block:.875rem 1.125rem;border-radius:0 0 1.25rem 1.25rem;
  background:linear-gradient(180deg,var(--shell),var(--shell-2));color:var(--on-shell)}
.shell::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.1px,transparent 1.6px);background-size:10px 10px;
  -webkit-mask-image:linear-gradient(120deg,transparent 38%,#000 100%);mask-image:linear-gradient(120deg,transparent 38%,#000 100%)}
.shell .wrap{position:relative}
.shell-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.name{font-size:2.25rem;line-height:1.08;font-weight:800;font-stretch:var(--display)}
.size{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:.75rem;background:rgba(255,255,255,.13);
  font-weight:700;line-height:1;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.size .aa{display:flex;align-items:baseline;gap:1px}
.size .aa span:first-child{font-size:.8125rem}
.size .aa span:last-child{font-size:1.1875rem}
.size:active{background:rgba(255,255,255,.24);transform:scale(.94)}
.shell :focus-visible{outline-color:var(--on-shell)}
.date{margin-top:.125rem;color:var(--on-shell-2);font-size:.9375rem;line-height:1.4}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;min-height:2.125rem;margin-top:.625rem}
.stat{display:flex;align-items:baseline;gap:.375rem;padding:.25rem .625rem .3125rem;border-radius:.625rem;background:rgba(255,255,255,.13);
  font-size:.875rem;line-height:1.3;color:var(--on-shell-2);white-space:nowrap}
.stat b{font-size:1.1875rem;font-weight:800;font-stretch:var(--display);color:var(--on-shell)}
.stat--hot{background:var(--warn-tile);color:var(--on-warn-tile)}
.stat--hot b{color:inherit}
.search{margin-top:.75rem;display:flex;align-items:center;gap:.5rem;height:3rem;padding-inline:.875rem .25rem;border-radius:.875rem;
  background:var(--field);color:var(--ink);box-shadow:0 8px 20px -12px rgba(0,0,0,.45)}
.search:focus-within{outline:3px solid var(--on-shell);outline-offset:2px}
.search .ic{color:var(--ink-3)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;color:inherit;outline:0;padding:0;appearance:none;text-overflow:ellipsis}
.search input::placeholder{color:var(--ink-3);opacity:1}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:2.5rem;height:2.5rem;display:grid;place-items:center;color:var(--ink-3);border-radius:.625rem}

/* ---------- tabs: a segmented control ---------- */
.tabs{position:sticky;top:0;z-index:5;padding:.625rem 0 .375rem;background:var(--ground)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:.25rem;border-radius:.875rem;background:var(--seg)}
.thumb{position:absolute;top:.25rem;bottom:.25rem;left:.25rem;width:calc((100% - .5rem)/3);border-radius:.625rem;background:var(--sheet);
  box-shadow:0 1px 3px rgba(20,22,26,.16);transform:translateX(calc(var(--i,0)*100%));transition:transform .28s var(--ease)}
.tab{position:relative;z-index:1;height:2.5rem;display:flex;align-items:center;justify-content:center;gap:.375rem;padding-inline:.25rem;
  white-space:nowrap;font-size:min(.9375rem,4vw);font-weight:600;font-stretch:88%;color:var(--ink-2);border-radius:.625rem;
  transition:color .18s var(--ease)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab .n{min-width:1.5em;padding:.05rem .4em;border-radius:1rem;background:rgba(127,133,140,.2);color:var(--ink-2);
  font-size:min(.8125rem,3.5vw);font-weight:650;font-stretch:100%;text-align:center;transition:background-color .18s var(--ease),color .18s var(--ease)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}

/* ---------- sector chips ---------- */
.chips{display:flex;gap:.5rem;overflow-x:auto;max-width:40rem;margin-inline:auto;padding:.375rem 1rem .25rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:2.5rem;padding-inline:.75rem .875rem;display:flex;align-items:center;gap:.375rem;white-space:nowrap;
  border-radius:1.25rem;background:var(--sheet);font-size:.9375rem;font-weight:500;color:var(--ink-2);
  transition:background-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.chip .ic{color:var(--ink-3)}
.chip .n{font-size:.8125rem;color:var(--ink-3)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed="true"] .ic,.chip[aria-pressed="true"] .n{color:inherit;opacity:.88}

.strip{margin-top:.75rem;padding:.5rem .75rem;border-radius:.75rem;border:1px dashed var(--rule-2);font-size:.8125rem;line-height:1.4;color:var(--ink-2)}
.strip--warn{border:0;background:var(--warn-bg);color:var(--ink)}

/* ---------- day groups and notice rows ---------- */
.day-h{position:sticky;top:var(--tabs-h);z-index:3;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:.875rem .25rem .5rem;background:var(--ground);font-size:1.0625rem;line-height:1.3;font-weight:750;font-stretch:80%}
.day-n{flex:none;font-size:.875rem;font-weight:500;font-stretch:100%;color:var(--ink-3)}
.day-n.is-warn{color:var(--warn);font-weight:650}
.day-n.is-crit{color:var(--crit);font-weight:700}
.rows{overflow:hidden;border-radius:1rem;background:var(--sheet);box-shadow:var(--lift)}
.day--bare{padding-top:.75rem}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 2.75rem}
.row+.row::before{content:"";position:absolute;top:0;left:4.875rem;right:0;height:1px;background:var(--rule)}
.row-main{display:grid;grid-template-columns:3.375rem minmax(0,1fr);column-gap:.75rem;align-items:center;padding:.75rem 0 .75rem .75rem;
  transition:background-color .15s var(--ease)}
.row-main:active{background:var(--sheet-2)}
@media (hover:hover){.row-main:hover{background:var(--sheet-2)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.75rem;border-radius:.75rem;
  background:var(--tile);color:var(--tile-ink);font-stretch:var(--display);line-height:1;text-align:center}
.tile small{font-size:.75rem;font-weight:700;letter-spacing:.03em;opacity:.86}
.tile b{margin:.125rem 0 .0625rem;font-size:1.625rem;font-weight:800}
.tile--time b{margin:.1875rem 0 0;font-size:1.1875rem;font-stretch:72%}
.tile.is-warn{background:var(--warn-tile);color:var(--on-warn-tile)}
.tile.is-crit{background:var(--crit-tile);color:var(--on-crit-tile)}
.tile.is-off{background:var(--sheet-2);color:var(--ink-3)}
.row-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  font-size:1.0625rem;line-height:1.28;font-weight:650;font-stretch:88%}
.row-buyer{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:.1875rem;
  font-size:.9375rem;line-height:1.35;color:var(--ink-2)}
.row-meta{display:block;overflow:hidden;margin-top:.3125rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.row-meta .mi{display:flex;flex-wrap:wrap;margin-left:-1rem}
.row-meta .mi>span{position:relative;display:inline-flex;align-items:center;gap:.3125rem;padding-left:1rem;white-space:nowrap}
.row-meta .mi>span::before{content:"";position:absolute;left:.375rem;top:.6em;width:.1875rem;height:.1875rem;border-radius:50%;background:var(--ink-3);opacity:.55}
.left.is-warn{color:var(--warn);font-weight:650}
.left.is-crit{color:var(--crit);font-weight:700}
.left.is-closed{font-weight:600}
.tag{color:var(--accent);font-weight:650}
.row.is-off .row-title{color:var(--ink-3)}
.star{display:grid;place-items:center;color:var(--ink-3);border-radius:.625rem;transition:color .15s var(--ease)}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] .ic{fill:currentColor}
.star.pop .ic{animation:pop .32s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.anim .day{animation:rise .36s var(--ease) both}
.anim .day:nth-child(2){animation-delay:.04s}
.anim .day:nth-child(n+3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(.625rem)}}

.empty{margin-top:1rem;padding:1.5rem 1.25rem 1.625rem;border-radius:1rem;background:var(--sheet);box-shadow:var(--lift);color:var(--ink-2)}
.empty h2{font-size:1.1875rem;line-height:1.3;font-weight:750;font-stretch:80%;color:var(--ink)}
.empty p{margin-top:.5rem;max-width:34ch}
.empty .btn{margin-top:1rem;display:inline-flex}
.skel{margin-top:1rem}
.skel i{display:block;border-radius:.375rem;background:linear-gradient(100deg,var(--sheet-2) 40%,var(--rule) 50%,var(--sheet-2) 60%) 0 0/300% 100%;animation:shimmer 1.3s linear infinite}
.skel .tile{background:none;padding:0}
.skel .tile i{width:100%;height:3.75rem;border-radius:.75rem}
@keyframes shimmer{to{background-position:-150% 0}}

.foot{margin-top:1.5rem;padding:0 .25rem 2.5rem;font-size:.875rem;line-height:1.45;color:var(--ink-3)}

/* ---------- notice view ---------- */
.dbar{position:sticky;top:0;z-index:5;background:var(--ground)}
.dbar-in{display:flex;align-items:center;justify-content:space-between;height:3.25rem;max-width:40rem;margin-inline:auto;padding-inline:.375rem .625rem}
.dbar button{height:2.75rem;display:flex;align-items:center;gap:.25rem;padding-inline:.5rem .75rem;border-radius:.75rem;font-weight:600;font-stretch:88%;
  transition:background-color .15s var(--ease)}
.dbar button:active{background:var(--seg)}
.dbar-r{display:flex;gap:.25rem}
.dbar .star{display:flex}
.dbar [data-share]{padding-inline:.625rem}
#detail .wrap{padding-bottom:2.5rem;animation:enter .3s var(--ease)}
html[data-nav] #detail .wrap{animation:none}
@keyframes enter{from{opacity:.3;transform:translateY(.625rem)}}
.hero{position:relative;overflow:hidden;padding:1.125rem 1rem 1.125rem;border-radius:1.25rem;
  background:linear-gradient(180deg,var(--shell),var(--shell-2));color:var(--on-shell)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.1px,transparent 1.6px);background-size:10px 10px;
  -webkit-mask-image:linear-gradient(120deg,transparent 45%,#000 100%);mask-image:linear-gradient(120deg,transparent 45%,#000 100%)}
.hero>*{position:relative}
.d-title{font-size:1.5rem;line-height:1.2;font-weight:750;font-stretch:80%;text-wrap:balance}
.d-title:focus{outline:0}
.d-buyer{margin-top:.5rem;color:var(--on-shell-2);line-height:1.4}
.hero-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.875rem}
.hero-tags span{display:inline-flex;align-items:center;gap:.3125rem;padding:.25rem .625rem;border-radius:1rem;background:rgba(255,255,255,.14);font-size:.875rem}
.sheet{margin-top:.75rem;padding:1rem;border-radius:1rem;background:var(--sheet);box-shadow:var(--lift)}
.due{display:grid;grid-template-columns:4.25rem minmax(0,1fr);gap:.875rem;align-items:center}
.due .tile{min-height:4.75rem;border-radius:.875rem;view-transition-name:tile}
.due .tile b{font-size:2.125rem}
.due .tile small{font-size:.8125rem}
.due-l{display:block;font-size:.875rem;color:var(--ink-3)}
.due-d{display:block;margin-top:.125rem;font-size:1.25rem;line-height:1.25;font-weight:750;font-stretch:80%}
.due-r{display:block;margin-top:.25rem;font-weight:650;color:var(--ink-2)}
.due.is-warn .due-r{color:var(--warn)}
.due.is-crit .due-r{color:var(--crit)}
.prog-w{grid-column:1/-1}
.prog{height:.375rem;border-radius:.25rem;background:var(--sheet-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:.25rem;background:var(--accent);transform-origin:left;animation:grow .6s var(--ease) both}
.due.is-warn .prog i{background:var(--warn-tile)}
.due.is-crit .prog i{background:var(--crit-tile)}
@keyframes grow{from{transform:scaleX(0)}}
.prog-l{display:flex;justify-content:space-between;gap:1rem;margin-top:.375rem;font-size:.8125rem;color:var(--ink-3)}
.acts{display:grid;gap:.625rem;margin-top:.75rem}
@media (min-width:30rem){.acts{grid-template-columns:1fr 1fr}}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;padding:.5rem 1rem;border-radius:.875rem;
  background:var(--sheet);color:var(--ink);box-shadow:var(--lift);font-weight:650;font-stretch:88%;text-decoration:none;text-align:center;
  transition:transform .15s var(--ease),filter .15s var(--ease)}
.btn:active{transform:scale(.975)}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--primary:active{filter:brightness(.92)}
.sec h2{font-size:1.0625rem;line-height:1.3;font-weight:750;font-stretch:80%}
.facts{margin-top:.25rem}
.facts>div{display:grid;grid-template-columns:2.25rem minmax(0,1fr);column-gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.facts>div:last-child{border-bottom:0;padding-bottom:0}
.f-ic{grid-row:1/3;align-self:start;width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:.625rem;background:var(--tile);color:var(--tile-ink)}
.f-ic .ic{width:1.25rem;height:1.25rem}
.facts dt{font-size:.875rem;color:var(--ink-3)}
.facts dd{margin-top:.0625rem}
.facts small,.tl small{display:block;margin-top:.25rem;font-size:.875rem;line-height:1.4;color:var(--ink-3)}
.tl{margin-top:.875rem}
.tl li{position:relative;padding:0 0 1.125rem 1.875rem}
.tl li::before{content:"";position:absolute;left:.1875rem;top:.375rem;width:.75rem;height:.75rem;border-radius:50%;
  border:2px solid var(--ink-3);background:var(--sheet)}
.tl li::after{content:"";position:absolute;left:.5rem;top:1.375rem;bottom:-.125rem;width:2px;margin-left:-.5px;border-radius:1px;background:var(--rule)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl .is-past{color:var(--ink-3)}
.tl .is-past::before{background:var(--ink-3)}
.tl .is-past::after{background:var(--ink-3);opacity:.45}
.tl .is-key::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--tile)}
.tl .is-key.is-past::before{border-color:var(--ink-3);background:var(--ink-3);box-shadow:none}
.tl b{display:block;font-weight:650}
.tl .is-key b{font-weight:750}
.official{margin-top:.5rem;color:var(--ink-2)}
.code{margin-top:.5rem;font-size:.875rem;color:var(--ink-3)}
.steps{margin-top:.75rem;counter-reset:s}
.steps li{position:relative;padding:0 0 .75rem 2.125rem;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:.0625rem;width:1.5rem;height:1.5rem;border-radius:50%;
  display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);font-size:.8125rem;font-weight:800}
.fine{margin-top:.25rem;font-size:.875rem;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:1.25rem;z-index:20;max-width:calc(100% - 2rem);padding:.6875rem 1rem;border-radius:.875rem;
  background:var(--ink);color:var(--ground);font-size:.9375rem;font-weight:500;box-shadow:0 10px 28px -8px rgba(0,0,0,.4);
  transform:translate(-50%,1rem);opacity:0;pointer-events:none;transition:transform .26s var(--ease),opacity .2s var(--ease)}
.toast.on{transform:translate(-50%,0);opacity:1}

body[data-view="detail"] #home{display:none}
body[data-view="list"] #detail{display:none}

/* moving between the list and a notice */
html[data-nav="push"]::view-transition-old(root){animation:vt-out .18s var(--ease) both}
html[data-nav="push"]::view-transition-new(root){animation:vt-in-side .32s var(--ease) both}
html[data-nav="pop"]::view-transition-old(root){animation:vt-out-side .2s var(--ease) both}
html[data-nav="pop"]::view-transition-new(root){animation:vt-in .26s var(--ease) both}
::view-transition-group(tile){animation-duration:.34s;animation-timing-function:var(--ease)}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0}}
@keyframes vt-in-side{from{opacity:0;transform:translateX(1.5rem)}}
@keyframes vt-out-side{to{opacity:0;transform:translateX(1.5rem)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const HOUR = 36e5, DAY = 864e5, TZ = 4 * HOUR;            // Yerevan is UTC+4 all year
const toDate = s => (s ? new Date(s.slice(0, 16) + ':00+04:00') : null);
const dayNo = d => Math.floor((d.getTime() + TZ) / DAY);   // calendar day in Yerevan
const parts = d => { const x = new Date(d.getTime() + TZ); return {m: x.getUTCMonth(), d: x.getUTCDate(), wd: x.getUTCDay(), hh: x.getUTCHours(), mm: x.getUTCMinutes()}; };
const p2 = n => String(n).padStart(2, '0');

const WD = ['կիրակի', 'երկուշաբթի', 'երեքշաբթի', 'չորեքշաբթի', 'հինգշաբթի', 'ուրբաթ', 'շաբաթ'];
const WD3 = ['ԿԻՐ', 'ԵՐԿ', 'ԵՐՔ', 'ՉՐՔ', 'ՀՆԳ', 'ՈՒՐԲ', 'ՇԲԹ'];
const MON = ['հունվարի', 'փետրվարի', 'մարտի', 'ապրիլի', 'մայիսի', 'հունիսի', 'հուլիսի', 'օգոստոսի', 'սեպտեմբերի', 'հոկտեմբերի', 'նոյեմբերի', 'դեկտեմբերի'];
const MON3 = ['ՀՆՎ', 'ՓՏՐ', 'ՄՐՏ', 'ԱՊՐ', 'ՄՅՍ', 'ՀՆՍ', 'ՀԼՍ', 'ՕԳՍ', 'ՍԵՊ', 'ՀՈԿ', 'ՆՈՅ', 'ԴԵԿ'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fTime = d => { const p = parts(d); return `${p2(p.hh)}:${p2(p.mm)}`; };
const fDay = d => { const p = parts(d); return `${p.d} ${MON[p.m]}`; };
const fDayW = d => `${cap(WD[parts(d).wd])}, ${fDay(d)}`;
const fFull = d => `${fDay(d)}, ${WD[parts(d).wd]}, ժ. ${fTime(d)}`;
const fStamp = d => `${fDay(d)}, ${fTime(d)}`;
const fShort = d => { const p = parts(d); return `${p2(p.d)}.${p2(p.m + 1)}`; };

const SECTORS = {med: 'Բժշկական', food: 'Սնունդ', fuel: 'Վառելիք', build: 'Շինարարություն', it: 'ՏՏ և կապ', auto: 'Տրանսպորտ',
  elec: 'Էլեկտրական', furn: 'Կահույք', home: 'Տնտեսական', cloth: 'Հագուստ', office: 'Գրասենյակ',
  equip: 'Սարքեր', serv: 'Ծառայություններ', other: 'Այլ'};
const KINDS = {
  goods: ['Ապրանք', 'Պետք է մատակարարել ապրանք։'],
  services: ['Ծառայություն', 'Պետք է մատուցել ծառայություն։'],
  works: ['Աշխատանք', 'Պետք է կատարել աշխատանք, օրինակ՝ շինարարություն կամ վերանորոգում։']
};
const NO_SUBJECT = 'Գնման առարկան վերնագրում նշված չէ';
const ARMEPS = 'https://eauction.armeps.am';
const safe = u => (/^https:\/\//.test(u || '') ? u : '#');
const ic = (name, cls = '') => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state ---------- */
const S = {all: [], meta: {}, rev: 0, tab: 'new', sector: 'all', q: '', saved: new Set(), frozen: null, scroll: 0, openId: null,
  loaded: false, dirty: false, queue: [], stamp: ''};
const now = () => S.frozen ?? Date.now();
const store = {
  get(k) { try { return localStorage.getItem('tb.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('tb.' + k, v); } catch { /* private mode or full: keep it in memory */ } }
};
const IN_TG = /tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy;   // known before the Telegram script loads
let tg = null;

/* ---------- time left ---------- */
function left(end) {
  const ms = end - now(), days = dayNo(end) - dayNo(new Date(now()));
  if (ms <= 0) return {text: 'ժամկետն անցել է', lvl: 'closed'};
  if (days === 0) return {text: `այսօր, մինչև ${fTime(end)}`, lvl: 'crit'};
  if (days === 1) return {text: `վաղը, մինչև ${fTime(end)}`, lvl: 'crit'};
  return {text: `մնաց ${days} օր`, lvl: days <= 3 ? 'warn' : 'ok'};
}
const isOpen = t => t.status === 'open' && t.endD && t.endD > now();
const norm = s => String(s || '').toLowerCase().replace(/և/g, 'եվ').replace(/[«»"“”().,՝։]/g, ' ').replace(/\s+/g, ' ').trim();
const hay = t => t.hay || (t.hay = norm([t.subject, t.title, t.buyer, t.for, t.code, SECTORS[t.sector]].join(' ')));

/* ---------- lists ---------- */
let memo = {rev: -1, min: -1, open: []};
function openNow() {                      // the open tenders, worked out once a minute at most
  const min = Math.floor(now() / 6e4);
  if (memo.rev !== S.rev || memo.min !== min) memo = {rev: S.rev, min, open: S.all.filter(isOpen)};
  return memo.open;
}
function base(tab) {
  if (tab === 'saved') return S.all.filter(t => S.saved.has(t.id));
  const open = openNow();
  if (tab === 'due') return open;
  const today = dayNo(new Date(now()));
  let fresh = open.filter(t => t.pubD && today - dayNo(t.pubD) <= 2);
  if (!fresh.length) {                       // quiet days: show the most recent day that has any
    const last = Math.max(...open.map(t => (t.pubD ? dayNo(t.pubD) : -1)));
    fresh = open.filter(t => t.pubD && dayNo(t.pubD) === last);
  }
  return fresh;
}
function visible() {
  const words = norm(S.q).split(' ').filter(Boolean);
  let items = base(S.tab);
  if (words.length) items = items.filter(t => { const h = hay(t); return words.every(w => h.includes(w)); });
  const bySector = {};
  items.forEach(t => { bySector[t.sector] = (bySector[t.sector] || 0) + 1; });
  if (S.sector !== 'all' && !bySector[S.sector]) S.sector = 'all';
  const total = items.length;
  if (S.sector !== 'all') items = items.filter(t => t.sector === S.sector);
  return {items, bySector, total};
}

function tileHTML(t, mode) {
  const l = left(t.endD), p = parts(t.endD);
  const cls = !isOpen(t) ? ' is-off' : l.lvl === 'crit' || l.lvl === 'warn' ? ` is-${l.lvl}` : '';
  return mode === 'due'
    ? `<span class="tile tile--time${cls} num"><small>ԺԱՄԸ</small><b>${fTime(t.endD)}</b></span>`
    : `<span class="tile${cls} num"><small>${WD3[p.wd]}</small><b>${p.d}</b><small>${MON3[p.m]}</small></span>`;
}
function rowHTML(t, mode) {
  const l = left(t.endD), off = !isOpen(t), on = S.saved.has(t.id), meta = [];
  if (t.status === 'cancelled') meta.push('<span class="left is-closed">չեղարկված է</span>');
  else if (off || (mode !== 'due' && l.lvl !== 'ok')) meta.push(`<span class="left is-${l.lvl}">${l.text}</span>`);
  if (mode === 'due' && t.pubD && dayNo(t.pubD) === dayNo(new Date(now()))) meta.push('<span class="tag">նոր</span>');
  meta.push(`<span>${ic(t.sector, 'ic--s')}${esc(SECTORS[t.sector])}</span>`);
  if (t.lots) meta.push(`<span class="num">${t.lots} չափաբաժին</span>`);
  return `<li class="row${off ? ' is-off' : ''}" data-id="${t.id}">` +
    `<button class="row-main" type="button" data-open="${t.id}">${tileHTML(t, mode)}` +

/* Long lists are drawn a screenful at a time: the first rows at once, the rest as the reader scrolls. */
function flush(cap) {
  const more = $('#more');
  if (!more) return;
  let n = 0;
  while (S.queue.length && n < cap) {
    const g = S.queue[0];
    let sec = $(`.day[data-k="${g.key}"]`);
    if (!sec) {
      more.insertAdjacentHTML('beforebegin', `<section class="day${g.head ? '' : ' day--bare'}" data-k="${g.key}">${g.head}<ul class="rows"></ul></section>`);
      sec = more.previousElementSibling;
    }
    const take = g.rows.splice(0, cap - n);
    sec.lastElementChild.insertAdjacentHTML('beforeend', take.map(t => rowHTML(t, S.tab)).join(''));
    n += take.length;
    if (!g.rows.length) S.queue.shift();
  }
  if (!S.queue.length) more.remove();
}
function pump() {
  const more = $('#more');
  if (!more || !S.queue.length || document.body.dataset.view !== 'list') return;
  if (more.getBoundingClientRect().top < innerHeight + 1600) { flush(70); requestAnimationFrame(pump); }
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) pump(); }, {rootMargin: '1600px 0px'}) : null;

function render(animate) {
  if (!S.loaded) return;
  chrome();
  const {items, bySector, total} = visible();
  const keys = Object.keys(bySector).sort((a, b) => bySector[b] - bySector[a] || a.localeCompare(b));
  $('#chips').innerHTML = total ? `<button class="chip" type="button" data-sector="all" aria-pressed="${S.sector === 'all'}">Բոլորը <span class="n num">${total}</span></button>` +
    keys.map(k => `<button class="chip" type="button" data-sector="${k}" aria-pressed="${S.sector === k}">${ic(k, 'ic--s')}${esc(SECTORS[k])} <span class="n num">${bySector[k]}</span></button>`).join('') : '';
  $('#chips').hidden = !total;

  const today = dayNo(new Date(now())), upd = toDate(S.meta.updated);
  let html = '';
  if (S.meta.note) html += `<p class="strip">${esc(S.meta.note)}</p>`;
  if (upd && !S.frozen && now() - upd > 36 * HOUR) html += `<p class="strip strip--warn">Տվյալները վերջին անգամ թարմացվել են ${fStamp(upd)}-ին։ Հնարավոր է՝ նոր մրցույթներ կան, որոնք այստեղ դեռ չեն երևում։</p>`;

  S.queue = [];
  if (!items.length) html += emptyHTML();
  else if (S.tab === 'saved') {
    S.queue.push({key: 's', head: '', rows: [...items].sort((a, b) => (isOpen(b) - isOpen(a)) || (a.endD - b.endD))});
  } else {
    const due = S.tab === 'due', groups = new Map();
    const sorted = [...items].sort((a, b) => due ? (a.endD - b.endD) || (a.id - b.id) : (b.pubD - a.pubD) || (b.id - a.id));
    sorted.forEach(t => { const k = dayNo(due ? t.endD : t.pubD); (groups.get(k) || groups.set(k, []).get(k)).push(t); });
    groups.forEach((rows, k) => {
      const d = due ? rows[0].endD : rows[0].pubD, diff = k - today;
      let label = fDayW(d), side = `${rows.length} մրցույթ`, sideCls = '';
      if (diff === 0) label = `Այսօր, ${fDay(d)}`;
      else if (!due && diff === -1) label = `Երեկ, ${fDay(d)}`;
      else if (due && diff === 1) label = `Վաղը, ${fDay(d)}`;
      if (due) {
        side = diff <= 0 ? 'վերջին օրն է' : diff === 1 ? 'մնաց 1 օր' : `մնաց ${diff} օր`;
        sideCls = diff <= 1 ? ' is-crit' : diff <= 3 ? ' is-warn' : '';
      }
      S.queue.push({key: k, rows, head: `<h2 class="day-h"><span>${label}</span><span class="day-n num${sideCls}">${side}</span></h2>`});
    });
  }
  const list = $('#list');
  list.innerHTML = html + '<div id="more" aria-hidden="true"></div>';
  list.setAttribute('aria-labelledby', 'tab-' + S.tab);
  flush(26);
  if (S.queue.length) {
    if (io) { io.disconnect(); io.observe($('#more')); }
    else setTimeout(function rest() { flush(120); if (S.queue.length) setTimeout(rest, 30); }, 60);
  }
  if (animate && !CALM) { list.classList.add('anim'); setTimeout(() => list.classList.remove('anim'), 520); }
}

/* Swap screens. Where the browser can, the date tile travels from the row to the notice. */
let moving = null;
function nav(kind, update) {
  const done = () => { delete document.documentElement.dataset.nav; if (moving) { moving.style.viewTransitionName = ''; moving = null; } };
  if (CALM || !document.startViewTransition) { update(); return done(); }
  document.documentElement.dataset.nav = kind;
  try { document.startViewTransition(update).finished.then(done, done); } catch { done(); update(); }
}
function carry(id) {                       // name the row's tile so it can travel
  const tile = id && $(`[data-open="${id}"] .tile`);
  if (tile && !CALM) { tile.style.viewTransitionName = 'tile'; moving = tile; }
}
function show(id, fromRoute) {
  const t = S.all.find(x => x.id === id);
  if (!t) return showList(true);
  if (document.body.dataset.view === 'list') { S.scroll = window.scrollY; carry(id); }
  S.openId = id;
  nav('push', () => {
    $('#detail').innerHTML = detailHTML(t);
    document.body.dataset.view = 'detail';
    window.scrollTo(0, 0);
    $('.d-title').focus({preventScroll: true});
  });
  if (tg) tg.BackButton.show();
  if (!IN_TG && !fromRoute && location.hash !== '#t' + id) { S.pushed = true; location.hash = 't' + id; }
}
function showList(fromRoute) {
  const id = S.openId;
  S.openId = null;
  nav('pop', () => {
    document.body.dataset.view = 'list';
    $('#detail').innerHTML = '';
    if (S.dirty || S.tab === 'saved') { S.dirty = false; render(); }
    else {                                   // the list is still there: only the star and the counts can have changed
      const star = id && $(`.row [data-star="${id}"]`);
      if (star) { const on = S.saved.has(id); star.setAttribute('aria-pressed', on); star.setAttribute('aria-label', on ? 'Հանել պահվածներից' : 'Պահել'); }
      chrome();
    }
    window.scrollTo(0, S.scroll);
    carry(id);
    const row = id && $(`[data-open="${id}"]`);
    if (row) row.focus({preventScroll: true});
    pump();
  });
  if (tg) tg.BackButton.hide();
  if (!IN_TG && !fromRoute && /^#t\d+$/.test(location.hash)) {
    if (S.pushed) { S.pushed = false; history.back(); } else location.hash = '';
  }
}
function route() {
  const m = /^#t(\d+)$/.exec(location.hash);
  if (m && S.loaded) { if (S.openId !== +m[1]) show(+m[1], true); }
  else if (S.openId !== null) showList(true);
}

/* ---------- saved tenders ---------- */
function persist() {
  const v = [...S.saved].join(',');
  store.set('saved', v);
  try { if (tg && tg.CloudStorage && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem('saved', v); } catch { /* optional */ }
}
function toggleSaved(id, btn) {

  persist();
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch { /* optional */ }
  toast(on ? 'Պահվեց «Պահված» բաժնում' : 'Հանվեց պահվածներից');
  if (document.body.dataset.view === 'list' && S.tab === 'saved') return render();

  else btn.setAttribute('aria-label', on ? 'Հանել պահվածներից' : 'Պահել');
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');

}
let toastTimer;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

function share(id) {
  const t = S.all.find(x => x.id === id);
  if (!t) return;
  const text = `${t.subject || NO_SUBJECT}\nՀայտերը՝ մինչև ${fFull(t.endD)}`;
  if (tg) return tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(t.url)}&text=${encodeURIComponent(text)}`);
  const copy = () => navigator.clipboard.writeText(`${text}\n${t.url}`).then(() => toast('Հղումը պատճենվեց'), () => toast('Չհաջողվեց պատճենել հղումը'));
  if (navigator.share) navigator.share({text, url: t.url}).catch(e => { if (e && e.name !== 'AbortError') copy(); });
  else copy();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-sector],[data-open],[data-star],[data-back],[data-share],[data-ext],[data-retry]');
  if (!el) return;
  if (el.dataset.tab) { if (el.dataset.tab !== S.tab) { setTab(el.dataset.tab); const top = $('.shell').offsetHeight; if (window.scrollY > top) window.scrollTo(0, top); } }
  else if (el.dataset.sector) { S.sector = el.dataset.sector; render(); }
  else if (el.dataset.open) show(+el.dataset.open);
  else if (el.dataset.star) toggleSaved(+el.dataset.star, el);
  else if ('back' in el.dataset) showList();
  else if (el.dataset.share) share(+el.dataset.share);
  else if ('retry' in el.dataset) load();
  else if ('ext' in el.dataset && tg) { e.preventDefault(); tg.openLink(el.href); }
  try { if (tg && (el.dataset.tab || el.dataset.sector)) tg.HapticFeedback.selectionChanged(); } catch { /* optional */ }
});
$('#seg').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  setTab(TABS[(TABS.indexOf(S.tab) + (e.key === 'ArrowRight' ? 1 : 2)) % 3], true);
});
const q = $('#q');
let typing;
q.addEventListener('input', () => {
  $('#qClear').hidden = !q.value;
  clearTimeout(typing);
  typing = setTimeout(() => {                // wait for a pause in typing before redrawing
    S.q = q.value.trim();
    if (S.q && S.tab !== 'due') setTab('due'); else render();   // a search looks through every open tender
  }, 140);
});
q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
$('#qClear').addEventListener('click', () => { clearTimeout(typing); q.value = ''; S.q = ''; $('#qClear').hidden = true; render(); q.focus(); });
$('#sizeBtn').addEventListener('click', () => {
  const next = ((+store.get('size') || 0) + 1) % 3;
  store.set('size', next); applySize(next);
  toast(['Տառերը՝ սովորական', 'Տառերը՝ մեծ', 'Տառերը՝ շատ մեծ'][next]);
});
function applySize(n) { document.documentElement.style.fontSize = ['100%', '112.5%', '125%'][n] || '100%'; }
window.addEventListener('hashchange', () => { if (!IN_TG) route(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loaded && Date.now() - S.fetchedAt > 10 * 60e3) load(true); });

/* ---------- data ---------- */
function ingest(data) {
  S.meta = data.meta || {};
  S.frozen = S.meta.preview && S.meta.updated ? toDate(S.meta.updated).getTime() : null;   // a preview keeps its own clock
  S.all = (data.tenders || []).filter(t => t && t.id && t.end).map(t => ({...t,
    endD: toDate(t.end), pubD: toDate(t.pub || t.seen), askD: toDate(t.ask), aucD: toDate(t.auc),
    sector: SECTORS[t.sector] ? t.sector : 'other',
    url: t.url || `${ARMEPS}/hy/public/tender_details/by_end_bid_time/2/tid/${t.id}/`,
    inv: t.inv === 1 ? `${ARMEPS}/application/documents/public_invitation/tender_${t.id}.zip` : t.inv}));
  S.stamp = `${S.meta.updated}|${S.all.length}`;
  S.rev++;
  S.loaded = true;
}
function paint(first) {
  if (S.openId !== null) { S.dirty = true; return; }     // a notice is open: redraw the list when the reader returns
  const y = window.scrollY;
  render(first);
  if (!first) window.scrollTo(0, y);
}
async function load(quiet) {
  try {
    const res = await fetch('data/tenders.json', {cache: 'no-cache'});
    if (!res.ok) throw new Error(res.status);
    const text = await res.text(), data = JSON.parse(text);
    S.fetchedAt = Date.now();
    const was = S.stamp, first = !S.loaded;
    ingest(data);
    if (first || S.stamp !== was) paint(first);
    if (text.length < 15e5) store.set('data', text);       // next time the list is on screen before the network answers
    if (!quiet && !IN_TG) route();
  } catch (err) {
    if (quiet || S.loaded) return;
    $('#date').textContent = 'Տվյալները չեն բեռնվել';
    $('#chips').hidden = true;
    $('#list').innerHTML = `<div class="empty"><h2>Մրցույթները չհաջողվեց բեռնել</h2><p>Ստուգեք ինտերնետ կապը և փորձեք նորից։</p><button class="btn btn--primary" type="button" data-retry>Փորձել նորից</button></div>`;
  }
}

/* ---------- Telegram ---------- */
function initTelegram() {
  if (!IN_TG) return;
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  const start = () => {
    const app = window.Telegram && window.Telegram.WebApp;
    if (!app || app.initData === undefined || tg) return;
    tg = app;
    const theme = () => {
      document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
      const css = getComputedStyle(document.documentElement), ground = css.getPropertyValue('--ground').trim();
      try { tg.setHeaderColor(css.getPropertyValue('--shell').trim()); tg.setBackgroundColor(ground); tg.setBottomBarColor && tg.setBottomBarColor(ground); } catch { /* old clients */ }
    };
    try { tg.ready(); tg.expand(); theme(); tg.onEvent('themeChanged', theme); tg.BackButton.onClick(() => showList()); } catch { /* old clients */ }
    try { if (S.openId !== null) tg.BackButton.show(); } catch { /* old clients */ }
    try {
      if (tg.CloudStorage && tg.isVersionAtLeast('6.9')) tg.CloudStorage.getItem('saved', (err, val) => {
        if (err || !val) return;
        const before = S.saved.size;
        val.split(',').map(Number).filter(Boolean).forEach(id => S.saved.add(id));
        if (S.saved.size !== before) { persist(); if (S.loaded) paint(false); }
      });
    } catch { /* optional */ }
  };
  s.onload = start;
  document.head.appendChild(s);
}

/* ---------- start ---------- */
(store.get('saved') || '').split(',').map(Number).filter(Boolean).forEach(id => S.saved.add(id));
applySize(+store.get('size') || 0);
initTelegram();
try { const kept = store.get('data'); if (kept) { ingest(JSON.parse(kept)); render(true); if (!IN_TG) route(); } } catch { /* a damaged copy: wait for the network */ }
load();
})();
</script>
</body>
