name: Tenders

# GitHub starts these schedules late or not at all, so the Clock workflow starts this job too, on time:
# at 08:50 and 17:50 as "digest", at 11:50 and 14:50 as "refresh" (see clock.yml). The schedules stay as a second way in.
# Times are in UTC. Yerevan is UTC+4 all year, so 04:52 UTC is 08:52 in Yerevan.
# Reading ARMEPS takes a few minutes, so a run that starts at 08:52 sends its message at about 09:00.
on:
  schedule:
    - cron: "52 4 * * 1-6"   # 08:52 Mon-Sat: read ARMEPS; with a Telegram bot, the morning message at about 09:00
    - cron: "52 13 * * 1-5"  # 17:52 Mon-Fri: read ARMEPS; the evening message at about 18:00 if something new was published
    - cron: "37 * * * *"     # every hour: on weekdays from 09:37 to 17:37 refresh the site; otherwise only answer Start or Stop
  workflow_dispatch:
    inputs:
      mode:
        description: "digest = update and send a message, refresh = update only, inbox = only answer Start/Stop"
        type: choice
        options: [digest, refresh, inbox]
        default: digest

permissions:
  contents: write
  actions: write    # to start the Clock workflow if it has stopped

concurrency:
  group: tenders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The newest commit of the branch, not the one that was newest when this run was queued:
      # a run that waited for another one must start from the data that one saved.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to do
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.mode }}
        run: |
          hour=$((10#$(date -u +%H)))   # UTC; Yerevan is four hours ahead
          weekday=$(date -u +%u)        # 1 is Monday
          case "$SCHEDULE" in
            "37 * * * *")
              if [ "$weekday" -le 5 ] && [ "$hour" -ge 5 ] && [ "$hour" -le 13 ]; then mode=refresh; else mode=inbox; fi ;;
            "")  mode="${MANUAL:-digest}" ;;
            *)   mode=digest ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Read ARMEPS and talk to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          MODE: ${{ steps.pick.outputs.mode }}
          PYTHONUNBUFFERED: "1"
        run: python -m bot.main --mode "$MODE"

      - name: Save the data
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p docs/data bot/state
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add -A docs/data bot/state
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Update tenders $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Saved."
              exit 0
            fi
            # Something else was pushed meanwhile: put this run's data on top of it.
            git fetch -q origin "$BRANCH"
            git rebase -q -X theirs "origin/$BRANCH" || git rebase --abort
            sleep 3
          done
          echo "::error::The data could not be saved to the repository."
          exit 1

      # The Clock workflow starts this job on time; this job starts the clock if it finds none.
      - name: Keep the clock going
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bot.clock --watch

      - name: Keep the page that could not be read
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
