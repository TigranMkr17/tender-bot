name: Probe

# A one-off helper: fetches a few public pages and files of the register so their
# layout can be studied, and puts them on a throwaway branch.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Addresses to fetch, separated by spaces"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          n=0
          for u in $URLS; do
            n=$((n+1))
            name=$(printf 'f%02d' "$n")
            code=$(curl -sS -L --max-time 150 --retry 2 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -H "Accept-Language: hy,en;q=0.5" -o "$name.bin" -w '%{http_code} %{content_type} %{size_download}' "$u" || echo "failed")
            echo "$name $code $u" | tee -a index.txt
            sleep 6
          done
      - name: Put them on the samples branch
        run: |
          git checkout -q --orphan samples
          git rm -rfq --cached . >/dev/null 2>&1 || true
          rm -rf ./* .github
          cp -r /tmp/probe ./probe
          git add -f probe
          git -c user.name="tender-bot" -c user.email="tender-bot@users.noreply.github.com" commit -q -m "Samples"
          git push -q -f origin samples
