name: History

# The slow reading, apart from the hourly job: what is inside each open tender's invitation,
# and the lots and bids of finished tenders. Times are in UTC; Yerevan is four hours ahead.
on:
  schedule:
    - cron: "17 5-14 * * 1-5"         # 09:17-18:17 on weekdays: a short look for new invitations and results
    - cron: "17 17,19,21,23 * * *"    # 21:17-03:17: long runs that read back through the past year
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to read the register"
        default: "30"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide how long to read
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.minutes }}
        run: |
          case "$SCHEDULE" in
            "17 5-14 * * 1-5") minutes=9 ;;
            "")                minutes="${MANUAL:-30}" ;;
            *)                 minutes=95 ;;
          esac
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "Minutes: $minutes"

      - name: Read invitations and results
        env:
          MINUTES: ${{ steps.pick.outputs.minutes }}
          PYTHONUNBUFFERED: "1"
        run: python -m bot.deep --minutes "$MINUTES"

      - name: Save the data
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p docs/data bot/state
          git push -q origin --delete samples 2>/dev/null || true   # a branch left over from setting up
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add -A docs/data bot/state
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Update history $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4; do
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Saved."
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase -q -X theirs "origin/$BRANCH" || git rebase --abort
            sleep 3
          done
          echo "::error::The data could not be saved to the repository."
          exit 1
